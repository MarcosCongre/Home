version: '3.9'

services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: home
      DB_USERNAME: root
      DB_PASSWORD: 
      DB_CHARSET: utf8mb4
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8443
      JWT_SECRET: change-me-in-production
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: home
      MYSQL_USER: home
      MYSQL_PASSWORD: home
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "home", "-phome"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
