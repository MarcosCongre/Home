# HomeApp site for the LAN home server.
# Install: /etc/nginx/sites-available/homeapp, symlinked from sites-enabled.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # LAN only.
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/24;
    deny all;

    root /srv/homeapp/web;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    location = /api {
        rewrite ^ /api/ last;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/homeapp/backend/public/index.php;
        fastcgi_pass unix:/run/php/homeapp.sock;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
