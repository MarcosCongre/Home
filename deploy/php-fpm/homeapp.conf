; HomeApp PHP-FPM pool, sized for a 1 GB RAM server.
; Install: /etc/php/8.4/fpm/pool.d/homeapp.conf
[homeapp]
user = www-data
group = www-data

listen = /run/php/homeapp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Spawn workers only when requests arrive; keep at most 3 alive.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 64M
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
